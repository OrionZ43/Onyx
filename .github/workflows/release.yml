name: Build & Release

on:
  push:
    tags:
      - 'v*'

# Без этого GITHUB_TOKEN по умолчанию получает только read-права, и шаг
# создания GitHub Release падает с 403 "Resource not accessible by
# integration". contents: write разрешает джобам создавать релизы и
# загружать в них артефакты.
permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # Ядро sing-box для Android (цепочка Hysteria2/TUIC и Deep Probe).
      # В git не храним: ~80 МБ. Версия и SHA-256 — в tools/core/fetch-core.sh.
      - name: Fetch sing-box core (Android)
        run: bash tools/core/fetch-core.sh android

      - name: Build APK
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          flutter build apk --release --target-platform android-arm64 --dart-define=APP_VERSION=$VERSION

      - name: Rename APK to stable name
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk onyx-android.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: onyx-android.apk
          name: Onyx VPN ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows app
        env:
          # Дублируем заглушку депрекации корутин на уровне переменной
          # окружения — гарантированно долетает до всех плагинов, включая
          # permission_handler_windows, даже если CMake-дефайн до них не дошёл.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          flutter build windows --release --dart-define=APP_VERSION=$version

      # #55: запускатель ядра с правами админа (задача планировщика). Установщик
      # кладёт его в C:\Program Files\Onyx\core вместе с sing-box и WinTUN.
      - name: Build onyx-core
        run: |
          cd tools/onyx_core
          dart pub get
          cd ../..
          dart compile exe tools/onyx_core/bin/onyx_core.dart -o build/onyx-core.exe

      # Папка для установщика: приложение + ядро (sing-box, WinTUN, onyx-core).
      # payload.zip и OnyxUpdater больше не нужны: встроенное обновление
      # запускает сам установщик тихо (#54).
      - name: Assemble dist
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build\windows\x64\runner\Release\*" dist\ -Recurse -Force
          # Ядро в бандле: в Китае первый запуск не может скачать его с GitHub.
          pwsh tools/core/fetch-core.ps1 -Out dist\core
          Copy-Item build\onyx-core.exe dist\core\

      - name: Build Installer (Inno Setup)
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # Нужен Inno Setup 6.7+ (тёмный мастер, свой фон): в образе может быть старее.
          choco upgrade innosetup -y --no-progress
          # Ядро и всё приложение — внутри одного OnyxSetup_<tag>.exe (#51).
          pwsh tools/installer/build-installer.ps1 -SourceDir dist -Version $version -OutputDir . -OutputName "OnyxSetup_${tag}"
          # Стабильная копия имени для ссылок вида releases/latest/download/...
          Copy-Item "OnyxSetup_${tag}.exe" "onyx-setup-windows.exe" -Force

      - name: Upload Windows artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OnyxSetup_${{ github.ref_name }}.exe
            onyx-setup-windows.exe
          name: Onyx VPN ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
