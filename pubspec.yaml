name: onyx
description: One-tap VPN client powered by sing-box
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Data / serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3

  # Crypto
  crypto: ^3.0.3

  # Network
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0

  # Navigation
  go_router: ^14.2.7

  # UI
  flutter_animate: ^4.5.0
  flutter_svg: ^2.3.0
  material_new_shapes: ^1.0.0
  dynamic_color: ^1.8.1

  # Links
  url_launcher: ^6.3.0

  # Platform / Process
  flutter_background_service: ^5.0.5
  permission_handler: ^11.3.1


  flutter_v2ray: ^1.0.10


  # Archive extraction (used by BinaryManager on Windows)
  archive: ^3.4.0

  # Path utilities
  path: ^1.9.0

  # Clash/mihomo YAML-подписки (SubscriptionParser)
  yaml: ^3.1.2

  # Windows-only platform features (must NOT be removed — used in main.dart)
  window_manager: ^0.3.8
  tray_manager: ^0.2.2
  local_notifier: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/rules/
    - assets/icons/onyx/
    - assets/icons/signal/
    - assets/flags/circle/
    - assets/flags/square/

  # Шрифты встроены (SIL OFL 1.1, лицензии — assets/fonts/OFL-*.txt), статические начертания.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-300.ttf
          weight: 300
        - asset: assets/fonts/InterTight-400.ttf
          weight: 400
        - asset: assets/fonts/InterTight-500.ttf
          weight: 500
        - asset: assets/fonts/InterTight-600.ttf
          weight: 600
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-400.ttf
          weight: 400
        - asset: assets/fonts/Roboto-500.ttf
          weight: 500
        - asset: assets/fonts/Roboto-700.ttf
          weight: 700
