<!doctype html>
<!--
  Мокапы редизайна Onyx VPN, этап 1 (концепции).
  Один файл на все три направления: #d=a|b|c&s=off|on|list&v=phone|desk
  Рендер в PNG: ./render.sh (headless Edge из WSL).
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#root{position:absolute;left:0;top:0}
#root,.app{width:var(--W);height:var(--H)}
body{-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
.ic{display:inline-block;width:var(--is,20px);height:var(--is,20px);background:currentColor;
  -webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat;flex:none}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1}
.app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:var(--ff)}
.mono{font-family:var(--fm)}
.t2{color:var(--t2)}.t3{color:var(--t3)}

/* ── телефон ── */
.sbar{height:44px;padding:0 26px 0 30px;justify-content:space-between;font:600 15px var(--ff);color:var(--t1)}
.sbar .r{gap:6px}
.sbar i{display:inline-block;background:var(--t1);border-radius:1px}
.phone .screen{position:absolute;inset:0;display:flex;flex-direction:column}
.phone .top{height:52px;padding:0 20px;justify-content:space-between}
.phone .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--t1);opacity:.9;transform:translateX(-50%)}

/* ── окно Windows ── */
.desk .titlebar,.det .titlebar{height:40px;padding-left:18px;justify-content:space-between;border-bottom:1px solid var(--line)}
.winbtn{width:46px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.winbtn b{display:block}
.desk .body{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex}
.desk .left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.desk .right{width:392px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--side)}
</style>
<style id="theme"></style>
</head>
<body>
<div id="root"></div>
<script>
const P = Object.fromEntries(location.hash.slice(1).split('&').map(kv => kv.split('=')));
const D = P.d || 'a', S = P.s || 'off', V = P.v || 'phone';
const ON = S === 'on', ING = S === 'ing', ERR = S === 'err', K = P.k || '1';

/* ───────────────────────── данные ───────────────────────── */
const SERVERS = [
  {cc:'NL', country:'Нидерланды', city:'Амстердам', id:'AMS-03', ping:38, ai:true,  sel:true},
  {cc:'NL', country:'Нидерланды', city:'Амстердам', id:'AMS-01', ping:44, ai:true},
  {cc:'NL', country:'Нидерланды', city:'Роттердам', id:'RTM-02', ping:52, ai:false},
  {cc:'FI', country:'Финляндия',  city:'Хельсинки', id:'HEL-02', ping:29, ai:true},
  {cc:'DE', country:'Германия',   city:'Франкфурт', id:'FRA-01', ping:41, ai:true},
  {cc:'DE', country:'Германия',   city:'Франкфурт', id:'FRA-04', ping:63, ai:false},
  {cc:'SE', country:'Швеция',     city:'Стокгольм', id:'STO-01', ping:47, ai:false},
  {cc:'PL', country:'Польша',     city:'Варшава',   id:'WAW-01', ping:55, ai:true},
  {cc:'US', country:'США',        city:'Нью-Йорк',  id:'NYC-02', ping:118, ai:true},
  {cc:'JP', country:'Япония',     city:'Токио',     id:'TYO-01', ping:212, ai:false},
];
const groups = [];
for (const s of SERVERS) { let g = groups.find(g => g.cc === s.cc); if (!g) groups.push(g = {cc:s.cc, country:s.country, items:[]}); g.items.push(s); }

/* ───────────────────────── помощники ───────────────────────── */
const SET = {a:'phosphor', a2:'phosphor', a2s:'phosphor', b:'lucide', c:'pixel', c2:'pixel', m3:'m3', m3b:'m3'}[D];
const ic = (n, size, extra='') => `<span class="ic ${extra}" style="--src:url(icons/${SET}/${n}.svg);--is:${size||20}px"></span>`;
const h = (s) => s; // для читаемости шаблонов

function statusBar() {
  return `<div class="sbar row"><span>9:41</span><span class="row r">
    <span class="row" style="gap:2px;align-items:flex-end">${[5,7,9,11].map(x=>`<i style="width:3px;height:${x}px"></i>`).join('')}</span>
    <span style="font:600 13px var(--ff);margin-left:4px">5G</span>
    <i style="width:24px;height:11px;border-radius:3px;margin-left:6px;opacity:.9"></i></span></div>`;
}
function winButtons() {
  return `<div class="row">
    <div class="winbtn"><b style="width:10px;height:1px;background:currentColor"></b></div>
    <div class="winbtn"><b style="width:10px;height:10px;border:1px solid currentColor"></b></div>
    <div class="winbtn">${ic('close',14)}</div></div>`;
}

/* dot-matrix 5×7 для направления C (рисуем сами — без лицензий) */
const GL = {
 '0':['01110','10001','10011','10101','11001','10001','01110'], '1':['00100','01100','00100','00100','00100','00100','01110'],
 '2':['01110','10001','00001','00010','00100','01000','11111'], '3':['11111','00010','00100','00010','00001','10001','01110'],
 '4':['00010','00110','01010','10010','11111','00010','00010'], '5':['11111','10000','11110','00001','00001','10001','01110'],
 '6':['00110','01000','10000','11110','10001','10001','01110'], '7':['11111','00001','00010','00100','01000','01000','01000'],
 '8':['01110','10001','10001','01110','10001','10001','01110'], '9':['01110','10001','10001','01111','00001','00010','01100'],
 'E':['11111','10000','10000','11110','10000','10000','11111'], 'R':['11110','10001','10001','11110','10100','10010','10001'], '+':['00000','00100','00100','11111','00100','00100','00000'],
 ':':['0','0','1','0','1','0','0'], '-':['000','000','000','111','000','000','000'], ' ':['0','0','0','0','0','0','0'],
};
function dots(text, d=6, gap=2, on='#fff', off='#161616') {
  let x = 0, out = '';
  for (const ch of text) {
    const g = GL[ch]; const w = g[0].length;
    g.forEach((row, y) => [...row].forEach((b, i) => {
      out += `<circle cx="${(x+i)*(d+gap)+d/2}" cy="${y*(d+gap)+d/2}" r="${d/2}" fill="${b==='1'?on:off}"/>`;
    }));
    x += w + 1;
  }
  const W = (x-1)*(d+gap)-gap, H = 7*(d+gap)-gap;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${out}</svg>`;
}

/* ═════════════════════════ A · ОБСИДИАН ═════════════════════════ */
const A = {
css: `
.app{--bg:#050506;--s1:#0C0C0E;--s2:#131316;--s3:#1B1B1F;--line:#222226;--line2:#2E2E33;
  --t1:#F3F1EC;--t2:#8F8C86;--t3:#57554F;--acc:#CDB38A;--acc2:#8C7A5C;--side:#08080A;
  --ff:'Inter',sans-serif;--fd:'Inter Tight',sans-serif;--fm:'Inter Tight',sans-serif}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%, #17171A 0%, transparent 60%)}
.word{font:600 13px var(--fd);letter-spacing:.42em;color:var(--t1)}
.word em{font-style:normal;color:var(--acc)}
.iconbtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--t2)}
.status{align-items:center;gap:6px;text-align:center}
.status .k{font:500 11px var(--fd);letter-spacing:.24em;text-transform:uppercase;color:var(--t2)}
.status .v{font:300 34px var(--fd);letter-spacing:-.02em}
.status .k b{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--t3);margin-right:9px;vertical-align:1px}
.on .status .k b{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.on .status .k{color:var(--acc)}
/* дайл */
.dial{position:relative;width:var(--D);height:var(--D)}
.dial .bezel{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 210deg,#1A1A1D,#5A5853 12%,#1C1C1F 28%,#38372F 46%,#141416 60%,#4E4C47 78%,#1A1A1D);
  -webkit-mask:radial-gradient(circle, transparent calc(50% - 14px), #000 calc(50% - 13px));}
.dial .bezel::after{content:"";position:absolute;inset:0;border-radius:50%;background:#050506;opacity:.35}
.dial svg.ticks{position:absolute;inset:0}
.dial .disc{position:absolute;inset:calc(var(--D)*.16);border-radius:50%;
  background:radial-gradient(circle at 50% 28%, #202024 0%, #0D0D0F 46%, #060607 80%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -18px 30px rgba(0,0,0,.6), 0 24px 60px rgba(0,0,0,.7), 0 0 0 1px #1E1E22;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t1)}
.dial .disc::before{content:"";position:absolute;left:18%;right:18%;top:7%;height:34%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0));}
.dial .disc span.l{font:500 10.5px var(--fd);letter-spacing:.26em;text-transform:uppercase;color:var(--t2)}
.on .dial .disc{box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -18px 30px rgba(0,0,0,.6), 0 24px 60px rgba(0,0,0,.7), 0 0 0 1px #3A3326, 0 0 80px rgba(205,179,138,.10)}
.on .dial .disc{color:var(--acc)}
.on .dial .disc span.l{color:var(--acc)}
.dial .mark{position:absolute;left:50%;top:-2px;width:0;height:0;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid var(--t3)}
.on .dial .mark{border-top-color:var(--acc)}
/* карточка сервера */
.srv{width:100%;border-radius:20px;background:var(--s1);border:1px solid var(--line);padding:14px 16px;gap:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.cc{width:34px;height:34px;border-radius:17px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font:600 10.5px var(--fd);letter-spacing:.1em;color:var(--t1);background:linear-gradient(180deg,#18181B,#0E0E10);flex:none}
.srv .n{font:500 15px var(--ff)}
.srv .m{font:400 12.5px var(--ff);color:var(--t2);margin-top:2px}
.ping{font:500 13px var(--fd);color:var(--t2)} .ping small{font-size:11px;color:var(--t3);margin-left:2px}
.ai{font:600 9.5px var(--fd);letter-spacing:.14em;color:var(--acc);border:1px solid #3A3326;border-radius:6px;padding:2px 5px 2px 6px}
/* усложнения (complications) — спрятанные функции */
.comps{gap:8px;justify-content:center}
.comp{gap:6px;font:500 10.5px var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--t3);
  border:1px solid var(--line);border-radius:14px;padding:6px 10px 6px 9px}
.comp b{width:5px;height:5px;border-radius:3px;background:var(--t3)}
.comp.lit{color:var(--t2)} .comp.lit b{background:var(--acc)}
.stats{width:100%;justify-content:space-between;padding:0 6px}
.stat .v{font:300 22px var(--fd);letter-spacing:-.01em}
.stat .v small{font-size:12px;color:var(--t2);margin-left:3px}
.stat .k{font:500 10px var(--fd);letter-spacing:.2em;text-transform:uppercase;color:var(--t3);margin-top:4px;gap:5px}
/* список */
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;background:var(--s1);border-radius:28px 28px 0 0;border-top:1px solid var(--line2);
  box-shadow:0 -30px 80px rgba(0,0,0,.8);display:flex;flex-direction:column}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 0}
.sh-h{padding:16px 20px 12px;justify-content:space-between}
.sh-h .t{font:400 26px var(--fd);letter-spacing:-.02em}
.search{margin:0 20px;height:44px;border-radius:22px;background:var(--bg);border:1px solid var(--line);gap:10px;padding:0 16px;color:var(--t3);font:400 14px var(--ff)}
.seg{margin:14px 20px 6px;gap:6px}
.seg span{font:500 12px var(--ff);color:var(--t2);padding:7px 14px;border-radius:16px;border:1px solid var(--line)}
.seg span.on{color:var(--bg);background:var(--t1);border-color:var(--t1)}
.list{flex:1;overflow:hidden;padding:4px 0 0}
.gh{padding:16px 20px 6px;font:500 10.5px var(--fd);letter-spacing:.22em;text-transform:uppercase;color:var(--t3);justify-content:space-between}
.it{padding:11px 20px;gap:14px}
.it .n{font:400 15px var(--ff)} .it .m{font:400 12px var(--ff);color:var(--t3);margin-top:1px}
.it.sel{background:linear-gradient(90deg,rgba(205,179,138,.07),transparent 70%);box-shadow:inset 2px 0 0 var(--acc)}
.it.sel .n{color:var(--acc)}
.auto{margin:8px 20px 2px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--bg);gap:14px}
.foot{border-top:1px solid var(--line);padding:14px 20px 28px;justify-content:space-between;font:400 12.5px var(--ff);color:var(--t2)}
.foot .add{gap:8px;color:var(--t1);font-weight:500}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.66)}
/* desktop */
.desk .titlebar .word{font-size:11.5px}
.panel{padding:22px 24px;border-bottom:1px solid var(--line)}
.panel .h{font:500 10.5px var(--fd);letter-spacing:.22em;text-transform:uppercase;color:var(--t3);margin-bottom:14px;justify-content:space-between}
.kv{justify-content:space-between;padding:9px 0;font:400 13.5px var(--ff);color:var(--t2);border-bottom:1px solid #141417}
.kv:last-child{border-bottom:0}
.kv b{font-weight:500;color:var(--t1)}
.sw{width:30px;height:18px;border-radius:9px;background:var(--s3);border:1px solid var(--line2);position:relative}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:6px;background:var(--t3)}
.sw.on{background:#2A2418;border-color:#4A3F2C}.sw.on::after{left:14px;background:var(--acc)}
`,
dial(D) {
  const n = 60, R = D/2 - 20, ticks = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 - Math.PI/2, big = i % 5 === 0;
    const r1 = R - (big ? 9 : 4), c = Math.cos(a), s = Math.sin(a);
    let col = ON ? (big ? '#CDB38A' : '#8C7A5C') : (big ? '#4A4945' : '#26262A');
    ticks.push(`<line x1="${D/2+c*r1}" y1="${D/2+s*r1}" x2="${D/2+c*R}" y2="${D/2+s*R}" stroke="${col}" stroke-width="${big?1.6:1}" stroke-linecap="round"/>`);
  }
  return `<div class="dial" style="--D:${D}px"><div class="bezel"></div>
    <svg class="ticks" width="${D}" height="${D}">${ticks.join('')}</svg><div class="mark"></div>
    <div class="disc">${ic('power', D*.12)}<span class="l">${ON?'Отключить':'Подключить'}</span></div></div>`;
},
status() {
  return `<div class="col status"><div class="k"><b></b>${ON?'Защищено':'Не защищено'}</div>
    <div class="v">${ON?'01:24:07':'Трафик открыт'}</div></div>`;
},
server(compact) {
  return `<div class="srv row"><div class="cc">NL</div><div class="grow"><div class="n">Нидерланды</div>
    <div class="m">Амстердам · AMS-03</div></div>
    <span class="ai">AI</span><span class="ping">38<small>мс</small></span><span class="t3">${ic('chev',16)}</span></div>`;
},
comps() {
  return `<div class="row comps"><span class="row comp lit"><b></b>Авто</span><span class="row comp lit"><b></b>AI-проба</span><span class="row comp ${ON?'lit':''}"><b></b>Kill switch</span></div>`;
},
stats() {
  return `<div class="row stats">
    <div class="col stat"><div class="v">1.82<small>ГБ</small></div><div class="row k">${ic('down',10)}Получено</div></div>
    <div class="col stat" style="align-items:center"><div class="v">214<small>МБ</small></div><div class="row k">${ic('up',10)}Отправлено</div></div>
    <div class="col stat" style="align-items:flex-end"><div class="v">185.•.•.12</div><div class="row k">IP туннеля</div></div></div>`;
},
item(s) {
  return `<div class="it row ${s.sel?'sel':''}"><div class="cc" style="width:30px;height:30px;font-size:9.5px">${s.cc}</div>
    <div class="grow"><div class="n">${s.city} <span class="t3" style="font-size:12px">${s.id}</span></div></div>
    ${s.ai?'<span class="ai">AI</span>':''}<span class="ping" style="width:48px;text-align:right${s.ping>150?';color:#B98B5E':''}">${s.ping}<small>мс</small></span></div>`;
},
list(desk) {
  return `<div class="sh-h row"><div class="t">Серверы</div><div class="row" style="gap:8px"><div class="iconbtn">${ic('refresh',16)}</div><div class="iconbtn">${ic('plus',16)}</div></div></div>
   <div class="search row">${ic('search',16)}Страна, город или сервер</div>
   <div class="row seg"><span class="on">Все · 10</span><span>AI · 6</span><span>Избранное</span></div>
   <div class="list">
     <div class="auto row"><div class="cc" style="color:var(--acc);border-color:#3A3326">${ic('zap',15)}</div>
       <div class="grow"><div class="n" style="font:500 14.5px var(--ff)">Автовыбор</div><div class="m" style="font:400 12px var(--ff);color:var(--t2)">Лучший по задержке и AI-пробе, переключит сам</div></div>
       <div class="sw on"></div></div>
     ${groups.map(g => `<div class="gh row"><span>${g.country}</span><span>${g.items.length}</span></div>${g.items.map(A.item).join('')}`).join('')}
   </div>
   <div class="foot row"><span class="row add">${ic('plus',15)}Добавить подписку</span><span>Проверено 2 мин назад</span></div>`;
},
phone() {
  if (S === 'list') return `<div class="screen">${statusBar()}<div class="top row"><span class="word">ONYX</span></div></div>
    <div class="dim"></div><div class="sheet"><div class="grab"></div>${A.list()}</div><div class="homebar"></div>`;
  return `<div class="screen">${statusBar()}
    <div class="top row"><span class="word">ONYX</span><div class="iconbtn">${ic('settings',18)}</div></div>
    <div class="main"><div style="height:34px"></div>${A.status()}<div style="flex:1"></div>${A.dial(270)}<div style="flex:1"></div>
      ${ON?A.stats()+'<div style="height:22px"></div>':''}${A.server()}<div style="height:16px"></div>${A.comps()}<div style="height:34px"></div></div></div><div class="homebar"></div>`;
},
desk() {
  const right = S === 'list'
   ? `<div class="col" style="height:100%;background:var(--s1)">${A.list(true)}</div>`
   : `<div class="panel"><div class="row h"><span>Сервер</span><span>${ic('chev',12)}</span></div>${A.server()}</div>
      <div class="panel"><div class="row h"><span>Сессия</span><span>${ON?'01:24:07':'—'}</span></div>
        <div class="kv row"><span>Получено</span><b>${ON?'1.82 ГБ':'—'}</b></div><div class="kv row"><span>Отправлено</span><b>${ON?'214 МБ':'—'}</b></div>
        <div class="kv row"><span>IP</span><b>${ON?'185.•.•.12 · NL':'95.•.•.40 · RU'}</b></div></div>
      <div class="panel" style="border:0"><div class="row h"><span>Защита</span></div>
        <div class="kv row"><span>Автопереключение</span><div class="sw on"></div></div>
        <div class="kv row"><span>Приоритет AI-сервисов</span><div class="sw on"></div></div>
        <div class="kv row"><span>Раздельный туннель</span><b class="t2" style="font-weight:400">4 приложения ${ic('chev',12)}</b></div></div>`;
  return `<div class="titlebar row"><span class="word">ONYX</span><div class="row">${A_titleIcons()}${winButtons()}</div></div>
    <div class="body"><div class="left">${A.status()}<div style="height:44px"></div>${A.dial(300)}<div style="height:44px"></div>${A.comps()}</div>
    <div class="right">${right}</div></div>`;
},
};
function A_titleIcons(){ return `<div class="winbtn">${ic('settings',16)}</div>`; }


/* ═════════════════════════ A2 · ОБСИДИАН без часов ═════════════════════════
   Характер A (чёрный камень, шампань, Inter, Phosphor), но кнопка — современная:
   k=1 — «линза»: круг с мягким объёмом, световой ободок, тонкое кольцо прогресса;
   k=2 — «галька»: скруглённый квадрат (squircle) с тем же материалом.
   Состояния: off | ing (подключение) | on | err | list. */
const A2 = Object.assign({}, A, {
css: A.css + `
.app{--acc:#D2B98F;--acc2:#8E7B5B;--err:#C8655A}
.status .v{font-weight:300}

  const rot = `transform="rotate(-90 ${D/2} ${D/2})"`;

  const startFix = `stroke-dashoffset="${-c0}"`;
  if (ON)  arc = shape(`fill="none" stroke="url(#g)" stroke-width="${w}" style="filter:drop-shadow(0 0 6px rgba(210,185,143,.45))"`);

  --ff:'Onest',sans-serif;--fm:'JetBrains Mono',monospace}
.cap{font:500 11px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}
.word{font:600 12px var(--fm);letter-spacing:.32em}
.iconbtn{width:40px;height:40px;border-radius:20px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--t1)}
.ring{position:relative;width:var(--R);height:var(--R)}
.ring>svg{position:absolute;inset:0}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.rec{gap:8px}.rec b{width:8px;height:8px;border-radius:4px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.card{width:100%;background:var(--s1);border-radius:24px}
.srv{padding:16px 18px;gap:14px}
.srv .n{font:500 17px var(--ff);letter-spacing:-.01em}.srv .m{margin-top:4px}
.cc{font:600 13px var(--fm);color:var(--t1);width:30px;flex:none}
.ai{font:600 10.5px var(--fm);color:#000;background:var(--t1);border-radius:4px;padding:1px 5px;letter-spacing:.06em}
.ping{font:500 13px var(--fm);color:var(--t2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.tile{background:var(--s1);border-radius:20px;padding:14px 16px;gap:8px}
.tile .v{font:500 22px var(--ff);letter-spacing:-.02em}.tile .v small{font:500 12px var(--fm);color:var(--t2);margin-left:4px}
.glyphs{gap:6px;width:100%}
.glyph{flex:1;background:var(--s1);border-radius:16px;padding:10px 12px;justify-content:space-between;align-items:center}
.glyph i{width:6px;height:6px;border-radius:3px;background:var(--t3);display:block}
.glyph.on i{background:var(--t1)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;background:var(--bg);border-radius:32px 32px 0 0;border-top:1px solid var(--line2);display:flex;flex-direction:column}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.sh-h{padding:22px 20px 14px;justify-content:space-between}
.search{margin:0 20px;height:48px;border-radius:24px;background:var(--s2);gap:10px;padding:0 18px;color:var(--t2);font:400 15px var(--ff)}
.chips{margin:14px 20px 4px;gap:8px}
.chips span{font:500 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--t2);padding:8px 14px;border-radius:18px;background:var(--s2)}
.chips span.on{background:var(--t1);color:#000}
.list{flex:1;overflow:hidden}
.gh{padding:18px 20px 6px}
.it{padding:12px 20px;gap:14px;font:400 16px var(--ff)}
.it .id{font:400 12px var(--fm);color:var(--t3);margin-left:6px}
.it.sel{background:var(--s1)}
.it .dotsel{width:8px;height:8px;border-radius:4px;border:1.5px solid var(--t3)}
.it.sel .dotsel{background:var(--acc);border-color:var(--acc)}
.pdots{gap:3px}.pdots i{width:4px;height:4px;border-radius:2px;background:#2A2A2A;display:block}.pdots i.l{background:var(--t1)}
.auto{margin:8px 20px 6px;padding:14px 18px;gap:14px;background:var(--s1);border-radius:20px}
.foot{padding:14px 20px 30px;justify-content:space-between;border-top:1px solid var(--line)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:8px;background:var(--t3)}
.sw.on{background:var(--t1);border-color:var(--t1)}.sw.on::after{left:19px;background:#000}
.desk .titlebar{border:0}
.desk .right{border-left:0;padding:0 16px 16px 0;background:transparent;gap:8px}
.blk{background:var(--s1);border-radius:24px;padding:18px 20px}
.tg{justify-content:space-between;padding:10px 0;font:400 14.5px var(--ff)}
`,
ring(R) {
  const n = 64, r = R/2 - 8, out = [];
  for (let i = 0; i < n; i++) {
    const a = i/n*Math.PI*2 - Math.PI/2;
    const col = ON ? (i === 0 ? '#FF3B2F' : '#FFFFFF') : (i % 8 === 0 ? '#3A3A3A' : '#1E1E1E');
    out.push(`<circle cx="${R/2+Math.cos(a)*r}" cy="${R/2+Math.sin(a)*r}" r="${ON && i===0 ? 4.2 : 3}" fill="${col}"/>`);
  }
  // второе, внутреннее кольцо — «трасса»
  const r2 = r - 20;
  for (let i = 0; i < 96; i++) { const a = i/96*Math.PI*2; out.push(`<circle cx="${R/2+Math.cos(a)*r2}" cy="${R/2+Math.sin(a)*r2}" r="1" fill="${ON?'#3A3A3A':'#171717'}"/>`); }
  const inner = ON ? dots('01:24', R*.0175, R*.0068, '#fff', '#141414') : dots('--:--', R*.0175, R*.0068, '#5a5a5a', '#121212');
  return `<div class="ring" style="--R:${R}px"><svg width="${R}" height="${R}">${out.join('')}</svg>
   <div class="c">${inner}<span class="cap" style="color:${ON?'var(--t1)':'var(--t2)'}">${ON?'нажми — отключить':'нажми — подключить'}</span></div></div>`;
},
status() {
  return ON ? `<div class="row rec"><b></b><span class="cap" style="color:var(--t1)">Защита активна</span></div>`
            : `<div class="row rec"><b style="background:var(--t3);box-shadow:none"></b><span class="cap">Не защищено</span></div>`;
},
server() {
  return `<div class="card srv row"><div class="cc">NL</div><div class="grow"><div class="n">Амстердам</div><div class="m cap" style="font-size:10.5px;color:var(--t3)">AMS-03 · авто</div></div>
   <span class="ai">AI</span><span class="ping">38MS</span><span class="t2">${ic('chev',18)}</span></div>`;
},
tiles() {
  return `<div class="tiles"><div class="col tile"><span class="cap row" style="gap:6px;font-size:10px">${ic('down',12)}Получено</span><div class="v">1.82<small>ГБ</small></div></div>
    <div class="col tile"><span class="cap row" style="gap:6px;font-size:10px">${ic('up',12)}Отправлено</span><div class="v">214<small>МБ</small></div></div></div>`;
},
glyphs() {
  const g = (t, on) => `<div class="row glyph ${on?'on':''}"><span class="cap" style="font-size:10px;color:${on?'var(--t1)':'var(--t3)'}">${t}</span><i></i></div>`;
  return `<div class="row glyphs">${g('Авто',true)}${g('AI',true)}${g('Kill',ON)}</div>`;
},
item(s) {
  const n = s.ping < 50 ? 4 : s.ping < 80 ? 3 : s.ping < 150 ? 2 : 1;
  return `<div class="it row ${s.sel?'sel':''}"><span class="dotsel"></span><span class="cc" style="font-size:12px">${s.cc}</span>
   <span class="grow">${s.city}<span class="id">${s.id}</span></span>${s.ai?'<span class="ai">AI</span>':''}
   <span class="ping" style="width:40px;text-align:right">${s.ping}</span><span class="row pdots">${[0,1,2,3].map(i=>`<i class="${i<n?'l':''}"></i>`).join('')}</span></div>`;
},
list() {
  return `<div class="sh-h row"><span style="font:500 28px var(--ff);letter-spacing:-.03em">Серверы</span><div class="row" style="gap:8px"><div class="iconbtn">${ic('refresh',18)}</div><div class="iconbtn">${ic('plus',18)}</div></div></div>
   <div class="search row">${ic('search',18)}Поиск</div>
   <div class="row chips"><span class="on">Все 10</span><span>AI 6</span><span>★ 2</span></div>
   <div class="list"><div class="auto row">${ic('zap',20)}<div class="grow"><div style="font:500 15px var(--ff)">Автовыбор</div><div class="cap" style="font-size:10px;color:var(--t3);margin-top:3px">пинг + AI-проба</div></div><div class="sw on"></div></div>
    ${groups.map(g => `<div class="gh row cap" style="justify-content:space-between;color:var(--t3)"><span>${g.country}</span><span>${String(g.items.length).padStart(2,'0')}</span></div>${g.items.map(C.item).join('')}`).join('')}</div>
   <div class="foot row cap" style="font-size:10px;color:var(--t3)"><span>+ Подписка</span><span>Проверено 2 мин</span></div>`;
},
phone() {
  const top = `<div class="top row"><span class="word">ONYX</span><div class="iconbtn">${ic('more',18)}</div></div>`;
  if (S === 'list') return `<div class="screen">${statusBar()}${top}</div><div class="dim"></div><div class="sheet">${C.list()}</div><div class="homebar"></div>`;
  return `<div class="screen">${statusBar()}${top}
   <div class="main"><div style="height:26px"></div>${C.status()}<div style="flex:1"></div>${C.ring(286)}<div style="flex:1"></div>
   ${ON?C.tiles()+'<div style="height:8px"></div>':''}${C.server()}<div style="height:8px"></div>${C.glyphs()}<div style="height:32px"></div></div></div><div class="homebar"></div>`;
},
desk() {
  const right = S === 'list' ? `<div class="col blk" style="flex:1;padding:0;overflow:hidden">${C.list()}</div>` :
   `${C.server()}${ON?C.tiles():`<div class="blk"><span class="cap" style="color:var(--t3)">Сессия</span><div style="margin-top:10px">${dots('--', 5, 2, '#444', '#111')}</div></div>`}
    <div class="blk" style="flex:1"><span class="cap" style="color:var(--t3)">Защита</span>
     <div class="tg row" style="margin-top:6px">Автопереключение<div class="sw on"></div></div>
     <div class="tg row">AI Direct Lane<div class="sw on"></div></div>
     <div class="tg row">Раздельный туннель<span class="cap">4 ПРИЛ. ›</span></div></div>`;
  return `<div class="titlebar row"><span class="word">ONYX</span><div class="row"><div class="winbtn">${ic('more',16)}</div>${winButtons()}</div></div>
   <div class="body"><div class="left">${C.status()}<div style="height:34px"></div>${C.ring(340)}<div style="height:34px"></div><div style="width:400px">${C.glyphs()}</div></div>
   <div class="right">${right}</div></div>`;
},
};

/* ───────────────────────── сборка ───────────────────────── */
function build(extra) {
  const T = Object.assign({a:A, a2:A2, b:B, c:C}, extra || {})[D];
  document.getElementById('theme').textContent = T.css;
  const big = V==='desk' || V==='det' || V==='chk';
  const W = big ? '1100px' : '390px', H = V==='chk' ? '920px' : big ? '720px' : '844px';
  document.documentElement.style.setProperty('--W', W);
  document.documentElement.style.setProperty('--H', H);
  const body = V==='desk' ? T.desk() : V==='det' ? T.det() : V==='chk' ? T.check() : T.phone();
  document.getElementById('root').innerHTML = `<div class="app ${V==='chk'?'det':V} ${S} ${ON?"on":"off"}">${body}</div>`;
  if (T.after) T.after();
}
</script>
<script src="flags-data.js"></script>
<script src="m3-shapes.js"></script>
<script src="mock-m3.js"></script>
<script src="mock-sources.js"></script>
<script src="mock-ext.js"></script>
</body>
